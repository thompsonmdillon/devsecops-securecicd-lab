name: security
on: [push, pull_request]
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }

      # GATE: Secret scan
      - name: Secret scan (Gitleaks)
        run: |
          docker run -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --exit-code 1 --redact

      # GATE: SAST
      - name: SAST (Semgrep)
        if: always()
        run: |
          pip install semgrep
          semgrep scan --config auto --error

      # REPORT: Dependency scan
      - name: Dependency scan (Trivy)
        if: always()
        run: |
          docker run -v "${{ github.workspace }}:/repo" aquasec/trivy:latest \
            fs --scanners vuln --exit-code 0 /repo

# Testing the security pipeline on a pull request.
